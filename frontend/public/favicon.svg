<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer gear / cogwheel teeth -->
  <circle cx="50" cy="50" r="46" fill="#F59E0B" stroke="#B45309" stroke-width="2" />
  <g stroke="#92400E" stroke-width="3">
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(0 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(30 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(60 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(90 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(120 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(150 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(180 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(210 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(240 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(270 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(300 50 50)" />
    <line x1="50" y1="4" x2="50" y2="10" transform="rotate(330 50 50)" />
  </g>

  <!-- Inner circular ribbon -->
  <circle cx="50" cy="50" r="38" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />

  <!-- Blue Ashok Chakra / Inner Core Ring -->
  <circle cx="50" cy="50" r="24" fill="#1E3A8A" stroke="#F59E0B" stroke-width="1.5" />

  <!-- Golden Flame of Knowledge / Diya -->
  <path
    d="M50 32 C54 38, 57 43, 50 53 C43 43, 46 38, 50 32 Z"
    fill="#FBBF24"
  />
  <circle cx="50" cy="42" r="3" fill="#EF4444" />

  <!-- Open Book Base -->
  <path
    d="M38 58 Q 50 62 50 67 Q 50 62 62 58 L 62 64 Q 50 68 50 72 Q 50 68 38 64 Z"
    fill="#FFFFFF"
    stroke="#1E3A8A"
    stroke-width="0.8"
  />

  <!-- Small Text arc indicator -->
  <circle cx="50" cy="50" r="32" stroke="#D97706" stroke-dasharray="3 3" stroke-width="1" fill="none" />
  <text x="50" y="22" text-anchor="middle" font-size="6" font-weight="bold" fill="#92400E" font-family="sans-serif">
    AICTE
  </text>
</svg>
